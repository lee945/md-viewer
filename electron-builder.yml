appId: com.lee945.mdviewer
productName: MD Viewer
copyright: Copyright © 2026 lee945
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
portable:
  artifactName: MD-Viewer-${version}-portable.exe
nsis:
  artifactName: MD-Viewer-${version}-setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
